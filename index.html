<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar da Live - TikTok</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f0f15;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fe2c55; /* Cor estilo TikTok */
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 500px;
    }

    .candidate-card {
      background: #1e1e28;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 2px solid transparent;
      transition: transform 0.1s ease;
    }

    /* Cores de destaque para cada candidato */
    .card-bolsonaro { border-color: #2563eb; } /* Azul / Rosa Branca */
    .card-renan { border-color: #25f4ee; }     /* Ciano / Presente TikTok */
    .card-lula { border-color: #dc2626; }      /* Vermelho / Rosa Vermelha */

    .candidate-header {
      text-align: center;
      margin-bottom: 12px;
    }

    .candidate-name {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .gift-info {
      font-size: 0.9rem;
      color: #a0a0ab;
      margin-top: 4px;
    }

    .gift-badge {
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      display: inline-block;
      margin-top: 4px;
    }

    .score-display {
      font-size: 3.5rem;
      font-weight: 800;
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-add {
      background-color: #22c55e;
      color: #ffffff;
    }

    .btn-sub {
      background-color: #ef4444;
      color: #ffffff;
    }

    .btn-reset {
      margin-top: 25px;
      background: transparent;
      border: 1px solid #4b5563;
      color: #9ca3af;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-reset:hover {
      background: #374151;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1> Votação na Live </h1>

  <div class="container">

    <!-- Flávio Bolsonaro -->
    <div class="candidate-card card-bolsonaro">
      <div class="candidate-header">
        <div class="candidate-name">Flávio Bolsonaro</div>
        <div class="gift-info">Envie: <span class="gift-badge" style="color: #ffffff;">🤍 Rosa Branca</span></div>
      </div>
      <div class="score-display" id="score-bolsonaro">0</div>
      <div class="controls">
        <button class="btn btn-sub" onclick="changeScore('bolsonaro', -1)">-1</button>
        <button class="btn btn-add" onclick="changeScore('bolsonaro', 1)">+1</button>
      </div>
    </div>

    <!-- Renan Santos -->
    <div class="candidate-card card-renan">
      <div class="candidate-header">
        <div class="candidate-name">Renan Santos</div>
        <div class="gift-info">Envie: <span class="gift-badge" style="color: #25f4ee;">🎁 Logo TikTok</span></div>
      </div>
      <div class="score-display" id="score-renan">0</div>
      <div class="controls">
        <button class="btn btn-sub" onclick="changeScore('renan', -1)">-1</button>
        <button class="btn btn-add" onclick="changeScore('renan', 1)">+1</button>
      </div>
    </div>

    <!-- Lula -->
    <div class="candidate-card card-lula">
      <div class="candidate-header">
        <div class="candidate-name">Lula</div>
        <div class="gift-info">Envie: <span class="gift-badge" style="color: #f87171;">🌹 Rosa Vermelha</span></div>
      </div>
      <div class="score-display" id="score-lula">0</div>
      <div class="controls">
        <button class="btn btn-sub" onclick="changeScore('lula', -1)">-1</button>
        <button class="btn btn-add" onclick="changeScore('lula', 1)">+1</button>
      </div>
    </div>

  </div>

  <button class="btn-reset" onclick="resetAll()">Zerar Placar</button>

  <script>
    // Objeto para guardar a contagem dos votos
    const scores = {
      bolsonaro: 0,
      renan: 0,
      lula: 0
    };

    // Função para alterar os votos
    function changeScore(candidate, amount) {
      scores[candidate] += amount;
     
      // Impede que o número de votos fique negativo
      if (scores[candidate] < 0) {
        scores[candidate] = 0;
      }

      // Atualiza o texto na tela
      document.getElementById(`score-${candidate}`).innerText = scores[candidate];
    }

    // Função para zerar tudo se necessário
    function resetAll() {
      if (confirm("Deseja realmente zerar todos os votos?")) {
        for (let key in scores) {
          scores[key] = 0;
          document.getElementById(`score-${key}`).innerText = 0;
        }
      }
    }
  </script>
</body>
</html>
